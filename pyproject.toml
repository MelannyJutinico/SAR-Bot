[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-bot"
version = "0.1.0"
description = "Simulador académico de rescate cooperativo con riesgo térmico"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rl = ["gymnasium>=1.0,<2", "numpy>=1.26,<3", "stable-baselines3>=2.4,<3"]
ui = ["pygame>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
