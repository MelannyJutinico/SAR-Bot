<text x="24" y="69" font-size="12" fill="#52514e">evaluación). El círculo marca el checkpoint que guardó el entrenamiento: el primero</text>
<text x="24" y="86" font-size="12" fill="#52514e">con más misiones completas, después más personas y después más retorno.</text>
