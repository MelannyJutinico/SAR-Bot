<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="477" viewBox="0 0 900 477" role="img" aria-labelledby="titulo descripcion" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="titulo">Duración frente a daño en misiones exitosas</title>
<desc id="descripcion">Pasos y daño de cada misión exitosa; las líneas unen el mismo caso entre las dos referencias deterministas.</desc>
<rect width="900" height="477" fill="#fcfcfb"/>
<text x="24" y="30" font-size="16" fill="#0b0b0b" font-weight="600">Duración frente a daño en misiones exitosas</text>
<text x="24" y="52" font-size="12" fill="#52514e">Desarrollo · perfil 10 × 10 con 3 personas · 2 casos distintos · 16 episodios</text>
<text x="24" y="69" font-size="12" fill="#52514e">La línea gris une el mismo caso resuelto por ruta corta y por ruta térmica: muestra cuántos pasos cuesta reducir el daño. En</text>
<text x="24" y="86" font-size="12" fill="#52514e">los casos idénticos (mismos pasos y daño) los dos puntos se superponen.</text>
<circle cx="29" cy="109" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="42" y="113" font-size="11" fill="#52514e">DQN (1 modelo)</text>
<circle cx="151.24" cy="109" r="4" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="164.24" y="113" font-size="11" fill="#52514e">Ruta corta</text>
<circle cx="248.84" cy="109" r="4" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="261.84" y="113" font-size="11" fill="#52514e">Ruta térmica</text>
<circle cx="358.76" cy="109" r="4" fill="#898781" stroke="#fcfcfb" stroke-width="2"/>
<text x="371.76" y="113" font-size="11" fill="#52514e">Aleatoria</text>
<line x1="445.2" y1="109" x2="457.2" y2="109" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
<text x="463.2" y="113" font-size="11" fill="#52514e">Mismo caso: ruta corta → ruta térmica</text>
