<text x="24" y="161" font-size="11" fill="#52514e">1 de 1 casos con éxito en ambas · 1 idénticos</text>
<text x="24" y="176" font-size="11" fill="#52514e">Medias: 6,0 → 6,0 pasos · 0,0 → 0,0 de daño</text>
