<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="489" viewBox="0 0 920 489" role="img" aria-labelledby="titulo descripcion" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="titulo">Pasos y daño entre misiones exitosas</title>
<desc id="descripcion">Distribución de pasos y daño de las misiones exitosas por estrategia, con medias y tamaños de muestra.</desc>
<rect width="920" height="489" fill="#fcfcfb"/>
<text x="24" y="30" font-size="16" fill="#0b0b0b" font-weight="600">Pasos y daño entre misiones exitosas</text>
<text x="24" y="52" font-size="12" fill="#52514e">Validación · manifiesto v2_12x12_v1 · perfil 12 × 12 con 3 personas · 20 casos distintos · 40 episodios</text>
<text x="24" y="69" font-size="12" fill="#52514e">Cada punto es una misión exitosa y la línea negra su media. La cifra junto a cada estrategia es éxitos/episodios: los fracasos no</text>
<text x="24" y="86" font-size="12" fill="#52514e">aportan puntos ni entran en la media, así que un fracaso temprano con poco daño no mejora el resultado.</text>
<text x="340" y="119" font-size="12" fill="#0b0b0b" font-weight="600">Pasos hasta terminar</text>
<text x="560" y="119" font-size="11" fill="#898781">media</text>
<text x="650" y="119" font-size="12" fill="#0b0b0b" font-weight="600">Daño térmico total</text>
<text x="870" y="119" font-size="11" fill="#898781">media</text>
<text x="318" y="119" font-size="11" fill="#898781" text-anchor="end">éxitos</text>
